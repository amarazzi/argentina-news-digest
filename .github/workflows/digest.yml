name: digest diario

on:
  schedule:
    # 06:13 en Argentina (UTC-3), todos los días. GitHub encola los cron y la hora en punto
    # es la más congestionada: pidiendo un minuto raro y una hora antes, el retraso típico
    # entra dentro de la mañana.
    - cron: "13 9 * * *"
  workflow_dispatch:

# Dos corridas en paralelo se pisarían el historial y mandarían el mismo digest dos veces.
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    # El historial de lo ya enviado se commitea al repo: el runner es efímero.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      # --save-memory: sólo el envío diario registra lo publicado; las corridas a mano
      # son pruebas y no tienen que consumir los temas del día siguiente.
      - run: newsbot --save-memory -v
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Si la corrida se cayó antes de poder avisar por sus propios medios (por ejemplo,
      # si murió instalando dependencias), el aviso lo manda el workflow.
      - name: avisar que falló
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Aviso: falló el brief de hoy. Log: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --output /dev/null
      # Corre aunque el envío haya fallado a la mitad: el CLI sólo actualiza el historial
      # con lo que sí llegó, y perder ese registro repetiría mañana lo ya leído.
      - name: guardar historial
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/history.json
          git diff --cached --quiet && exit 0
          git commit -m "historial: digest del $(date -u +%F)"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((attempt * 5))
          done
          exit 1
      # Los registros van a una rama aparte: son un archivo por día que crece para siempre
      # y no tienen por qué ensuciar el historial de `main` ni aparecer en cada diff.
      - name: guardar la corrida
        if: always()
        run: |
          ls runs/*.json.gz >/dev/null 2>&1 || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin runs:runs 2>/dev/null; then
            git worktree add /tmp/registro runs
          else
            git worktree add --detach /tmp/registro
            git -C /tmp/registro checkout --orphan runs
            git -C /tmp/registro rm -rq --cached . || true
            find /tmp/registro -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          fi
          mkdir -p /tmp/registro/runs && cp runs/*.json.gz /tmp/registro/runs/
          git -C /tmp/registro add runs
          git -C /tmp/registro diff --cached --quiet && exit 0
          git -C /tmp/registro commit -m "corrida del $(date -u +%F)"
          for attempt in 1 2 3; do
            git -C /tmp/registro push origin runs && exit 0
            git -C /tmp/registro pull --rebase origin runs || true
            sleep $((attempt * 5))
          done
          exit 1
