name: digest diario

on:
  schedule:
    # 07:00 en Argentina (UTC-3), todos los días.
    - cron: "0 10 * * *"
  workflow_dispatch:

# Dos corridas en paralelo se pisarían el historial y mandarían el mismo digest dos veces.
concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    # El historial de lo ya enviado se commitea al repo: el runner es efímero.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      # --save-memory: sólo el envío diario registra lo publicado; las corridas a mano
      # son pruebas y no tienen que consumir los temas del día siguiente.
      - run: newsbot --save-memory -v
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Corre aunque el envío haya fallado a la mitad: el CLI sólo actualiza el historial
      # con lo que sí llegó, y perder ese registro repetiría mañana lo ya leído.
      - name: guardar historial
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/history.json
          git diff --cached --quiet && exit 0
          git commit -m "historial: digest del $(date -u +%F)"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((attempt * 5))
          done
          exit 1
