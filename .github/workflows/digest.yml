name: digest diario

on:
  schedule:
    # 07:00 en Argentina (UTC-3), todos los días.
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    # El historial de lo ya enviado se commitea al repo: el runner es efímero.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: newsbot -v
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: guardar historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/history.json
          git diff --cached --quiet || git commit -m "historial: digest del $(date -u +%F)"
          git push
