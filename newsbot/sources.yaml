# Fuentes del recolector.
#   scope: ar    -> medios argentinos
#   scope: world -> cobertura internacional sobre temas argentinos
#
# Los feeds RSS directos sólo publican las últimas horas, así que la cobertura de la
# ventana completa viene sobre todo de las búsquedas de Google News: el recolector les
# pasa el `when:Nh` justo para cubrirla y después filtra por fecha exacta.

feeds:
  - name: Clarín
    url: https://www.clarin.com/rss/lo-ultimo/
    scope: ar
  - name: La Nación
    url: https://www.lanacion.com.ar/arc/outboundfeeds/rss/
    scope: ar
  - name: Perfil
    url: https://www.perfil.com/feed
    scope: ar
  - name: Ámbito
    url: https://www.ambito.com/rss/pages/home.xml
    scope: ar
  - name: Chequeado
    url: https://chequeado.com/feed/
    scope: ar

searches:
  # Medios argentinos.
  - query: site:infobae.com
    lang: es-419
    country: AR
    scope: ar
  - query: site:clarin.com OR site:lanacion.com.ar OR site:pagina12.com.ar
    lang: es-419
    country: AR
    scope: ar
  - query: site:ambito.com OR site:cronista.com OR site:perfil.com
    lang: es-419
    country: AR
    scope: ar
  - query: Argentina Gobierno OR economía OR Congreso
    lang: es-419
    country: AR
    scope: ar

  # Cobertura internacional sobre Argentina.
  - query: Argentina
    lang: en-US
    country: US
    scope: world
  - query: Argentina economy OR "Argentine peso"
    lang: en-US
    country: US
    scope: world
  - query: Milei
    lang: en-GB
    country: GB
    scope: world
  - query: Argentina
    lang: pt-BR
    country: BR
    scope: world
